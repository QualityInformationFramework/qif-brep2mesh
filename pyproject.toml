[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qif-brep2mesh"
version = "0.1"
description = "Tessellate the B-rep geometry of a QIF MBD document"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = ["numpy", "scipy", "triangle"]

# The ceiling is as real as the floor and is worth enforcing at install time
# rather than letting it surface later as a build failure inside triangle, which
# publishes neither a wheel nor an sdist for 3.14. The floor is match/case.
requires-python = ">=3.10,<3.14"

[project.scripts]
qif-brep2mesh = "qif_brep2mesh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
